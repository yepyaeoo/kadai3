
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadai3 YePyaeOo</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #hud {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 999;
        }

        button {
            font-size: 16px;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:active {
            background-color: #666;
        }
    </style>
</head>

<body>

    <div id="hud">
        <button id="glassesBtn">Glasses: None</button>
        <button id="hatsBtn">Hats: None</button>
        <button id="mustachesBtn">Mustaches: None</button>
    </div>

    <a-scene id="scene" mindar-face embedded>

        <a-entity id="face" mindar-face-target="anchorIndex: 168">

            <a-gltf-model
                id="glasses"
                visible="false">
            </a-gltf-model>

            <a-gltf-model
                id="hats"
                visible="false">
            </a-gltf-model>

            <a-gltf-model
                id="mustaches"
                visible="false">
            </a-gltf-model>

        </a-entity>

        <a-camera position="0 0 0"></a-camera>

    </a-scene>


    <script>

        const glasses = document.getElementById("glasses");
        const hats = document.getElementById("hats");
        const mustaches = document.getElementById("mustaches");

        const glassesBtn = document.getElementById("glassesBtn");
        const hatsBtn = document.getElementById("hatsBtn");
        const mustachesBtn = document.getElementById("mustachesBtn");



        const accessories = {

            glasses: {
                element: glasses,
                button: glassesBtn,
                currentIndex: -1,

                items: [
                    {
                        name: "Glasses 1",
                        src: "megane1.glb",
                        position: "-0.07 0 -0.1",
                        rotation: "0 -180 0",
                        scale: "0.7 0.7 0.7"
                    },
                    {
                        name: "Glasses 2",
                        src: "megane2.glb",
                        position: "0 0 -0.1",
                        rotation: "0 0 0",
                        scale: "0.55 0.55 0.55"
                    }
                ]
            },


            hats: {
                element: hats,
                button: hatsBtn,
                currentIndex: -1,

                items: [
                    {
                        name: "Hat 1",
                        src: "piratehat.glb",
                        position: "0 0.5 -1",
                        rotation: "0 0 0",
                        scale: "0.2 0.2 0.2" 
                    },
                    {
                        name: "Hat 2",
                        src: "tophat.glb",
                        position: "0 1 -1",
                        rotation: "0 0 0",
                        scale: "0.5 0.5 0.5"
                    }
                ]
            },


            mustaches: {
                element: mustaches,
                button: mustachesBtn,
                currentIndex: -1,

                items: [
                
                    {
                        name: "Mustache 1",
                        src: "Mustache2.glb",
                        position: "0 -0.5 -0.12",
                        rotation: "0 0 0",
                        scale: "0.02 0.02 0.02"
                    }
                ]
            }

        };



        function cycleAccessory(category) {

            const accessory = accessories[category];

            accessory.currentIndex =
                (accessory.currentIndex + 1) %
                (accessory.items.length + 1);


            if (accessory.currentIndex === accessory.items.length) {

                accessory.element.setAttribute("visible", false);

                accessory.button.textContent =
                    category.charAt(0).toUpperCase() +
                    category.slice(1) + ": None";

                return;
            }


            const selected =
                accessory.items[accessory.currentIndex];


            accessory.element.setAttribute("src", selected.src);

            accessory.element.setAttribute(
                "position",
                selected.position
            );

            accessory.element.setAttribute(
                "rotation",
                selected.rotation
            );

            accessory.element.setAttribute(
                "scale",
                selected.scale
            );

            accessory.element.setAttribute("visible", true);

            accessory.button.textContent =
                category.charAt(0).toUpperCase() +
                category.slice(1) + ": " + selected.name;

        }



        glassesBtn.addEventListener("click", function() {
            cycleAccessory("glasses");
        });

        hatsBtn.addEventListener("click", function() {
            cycleAccessory("hats");
        });

        mustachesBtn.addEventListener("click", function() {
            cycleAccessory("mustaches");
        });

    </script>

</body>
</html>
